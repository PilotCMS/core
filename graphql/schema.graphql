"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A JSON string."
scalar JSON @scalar(class: "Pilot\\Core\\GraphQL\\Scalars\\Json")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    "Get content by space, slug, and locale."
    content(
      space: String!
      slug: String!
      locale: String = "en"
      version: String = "published"
    ): Content @field(resolver: "Pilot\\Core\\GraphQL\\Queries\\ContentQuery")

    "List all contents in a space."
    contents(
      space: String!
      locale: String = "en"
      version: String = "published"
    ): [Content!]! @field(resolver: "Pilot\\Core\\GraphQL\\Queries\\ContentsQuery")
}

"Content item (page or folder)."
type Content {
    id: ID!
    slug: String!
    name: String!
    status: String!
    publishedAt: DateTime @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\ContentResolver@publishedAt")
    body: [Block!]! @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\ContentResolver@body")
}

"Block component in content."
type Block {
    _uid: ID! @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\BlockResolver@uid")
    component: String! @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\BlockResolver@component")
    data: JSON! @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\BlockResolver@data")
    children: [Block!]! @field(resolver: "Pilot\\Core\\GraphQL\\Resolvers\\BlockResolver@children")
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}
